[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = 
;	arduino-libraries/Wire @ ^1.0
	marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
	adafruit/Adafruit ADS1X15 @ ^2.4.0
	bogde/HX711 @ ^0.7.5
	arduino-libraries/Servo@^1.2.2
